---
- name: Поиск Grafana на хостах и в контейнерах
  hosts: "{{ hosts | default('', true) | string | replace(';', ',') | split(',') | map('trim') | reject('equalto', '') | list }}"
  strategy: free
  gather_facts: true
  gather_subset: ["!all", "!min", "distribution", "pkg_mgr"]
  vars:
    software_audit_target: "grafana"
  tasks:
    - name: Запустить аудит Grafana
      ansible.builtin.import_role:
        name: software_audit

- name: Сохранить CSV-отчет по Grafana на adm.lin
  hosts: adm.lin
  gather_facts: false
  vars:
    software_audit_target: "grafana"
  tasks:
    - name: Сформировать CSV-отчет
      ansible.builtin.import_role:
        name: software_audit
        tasks_from: report.yml