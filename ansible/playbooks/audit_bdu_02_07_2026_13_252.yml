---
- name: Безопасный аудит уязвимостей BDU (Read-Only) с сохранением в CSV
  hosts: all
  gather_facts: true
  become: true
  vars:
    report_output_dir: "./bdu_audit_reports"
    summary_csv_file: "./bdu_audit_reports/bdu_summary_report.csv"
    csv_header: "Hostname;FQDN;IP_Address;OS_Family;Distribution;Kernel;Matched_System_Packages;Kernel_and_Modules_BDU_08879_08889_08426_03970;Gitea_act_runner_BDU_08914;Django_and_ASGI_BDU_07723_07722;Zimbra_BDU_05086;GPAC_and_FFmpeg_BDU_08912_08913_08610;Nextcloud_OIDC_BDU_08694;Nginx_and_Squid_BDU_08881_08611"

  tasks:
    - name: Сбор данных об установленных системных пакетах (RPM/DEB)
      ansible.builtin.package_facts:
        manager: auto
      check_mode: false
      tags: [packages]

    - name: Фильтрация целевых системных пакетов (libssh2, nginx, squid, ffmpeg, gpac, django, zimbra)
      ansible.builtin.set_fact:
        installed_target_packages: >-
          {%- set pkg_list = [] -%}
          {%- for k, v in ansible_facts.packages.items() -%}
            {%- if k is match('^(libssh2.*|nginx.*|squid.*|ffmpeg.*|libavcodec.*|gpac.*|libgpac.*|.*django.*|zimbra.*)$') -%}
              {%- for item in v -%}
                {%- set _ = pkg_list.append(item.name ~ '=' ~ item.version ~ ('-' ~ item.release if item.release is defined and item.release else '')) -%}
              {%- endfor -%}
            {%- endif -%}
          {%- endfor -%}
          {{ pkg_list | join(' | ') | default('none', true) }}
      tags: [packages]

    - name: Аудит ядра и уязвимых модулей (BDU: 2026-08879, 2026-08889, 2026-08426, 2026-03970)
      ansible.builtin.shell: |
        set -o pipefail
        echo "KERNEL: $(uname -r)"
        echo "LOADED_MODULES: $(lsmod | grep -E '^(act_pedit|intel_vpu|ivpu|i8042)\b' | awk '{print $1}' | tr '\n' ',' || echo 'none')"
        if [ -d /sys/bus/platform/drivers/i8042 ]; then echo "I8042_SYSFS: active"; else echo "I8042_SYSFS: inactive"; fi
        echo "BLACKLIST: $(grep -rnE '^\s*(blacklist|install)\s+(act_pedit|intel_vpu|ivpu)' /etc/modprobe.d/ 2>/dev/null | tr '\n' ',' || echo 'not_blacklisted')"
      args:
        executable: /bin/bash
      register: kernel_check
      changed_when: false
      check_mode: false
      tags: [kernel]

    - name: Поиск Gitea act_runner (BDU: 2026-08914)
      ansible.builtin.shell: |
        set -o pipefail
        ps -ef | grep -q '[a]ct_runner' && echo "PROCESS: running" || echo "PROCESS: not_running"
        for p in $(which act_runner 2>/dev/null) $(find /opt /usr/local /srv /home /var/lib -maxdepth 4 -type f -name "act_runner" 2>/dev/null); do
          if [ -x "$p" ]; then
            echo "BIN: $p ($($p --version 2>/dev/null | head -n 1 || echo 'version_unknown'))"
          fi
        done
      args:
        executable: /bin/bash
      register: act_runner_check
      changed_when: false
      check_mode: false
      tags: [gitea]

    - name: Поиск Django и ASGI в Python окружениях (BDU: 2026-07723, 2026-07722)
      ansible.builtin.shell: |
        set -o pipefail
        python3 -c "import django; print('SYSTEM_DJANGO:', django.get_version())" 2>/dev/null || echo "SYSTEM_DJANGO: none"
        for cfg in $(find /opt /var/www /srv /home /usr/local -maxdepth 5 -name "pyvenv.cfg" 2>/dev/null); do
          venv_dir=$(dirname "$cfg")
          if [ -x "$venv_dir/bin/python" ]; then
            ver=$("$venv_dir/bin/python" -c "import django; print(django.get_version())" 2>/dev/null)
            if [ -n "$ver" ]; then
              asgi=$("$venv_dir/bin/pip" list 2>/dev/null | grep -iE 'daphne|uvicorn|hypercorn|asgiref' | awk '{print $1":"$2}' | tr '\n' ',')
              echo "VENV($venv_dir): Django=$ver [ASGI:${asgi:-none}]"
            fi
          fi
        done
      args:
        executable: /bin/bash
      register: django_check
      changed_when: false
      check_mode: false
      tags: [django]

    - name: Проверка Zimbra Collaboration Suite (BDU: 2022-05086)
      ansible.builtin.shell: |
        if [ -d /opt/zimbra ]; then
          su - zimbra -c "zmcontrol -v" 2>/dev/null || echo "zimbra_dir_exists_version_check_failed"
        else
          echo "not_installed"
        fi
      args:
        executable: /bin/bash
      register: zimbra_check
      changed_when: false
      check_mode: false
      tags: [zimbra]

    - name: Проверка GPAC / MP4Box и декодеров FFmpeg (BDU: 2026-08912, 2026-08913, 2026-08610)
      ansible.builtin.shell: |
        set -o pipefail
        if command -v MP4Box >/dev/null 2>&1; then
          echo "MP4BOX: $(MP4Box -version 2>&1 | head -n 1)"
        else
          found_mp4=$(find /opt /usr/local -maxdepth 4 -type f -name "MP4Box" 2>/dev/null | tr '\n' ',')
          echo "MP4BOX: ${found_mp4:-not_found}"
        fi
        if command -v ffmpeg >/dev/null 2>&1; then
          echo "FFMPEG: $(ffmpeg -version 2>&1 | head -n 1)"
          decs=$(ffmpeg -decoders 2>/dev/null | grep -E '\b(rasc|magicyuv)\b' | awk '{print $2}' | tr '\n' ',')
          echo "DECODERS: ${decs:-not_present}"
        else
          echo "FFMPEG: not_installed"
        fi
      args:
        executable: /bin/bash
      register: media_check
      changed_when: false
      check_mode: false
      tags: [media]

    - name: Проверка Nextcloud и модуля user_oidc (BDU: 2026-08694)
      ansible.builtin.shell: |
        set -o pipefail
        found=0
        for occ in $(find /var/www /srv /opt /home -maxdepth 4 -type f -name "occ" 2>/dev/null); do
          found=1
          nc_dir=$(dirname "$occ")
          if [ -f "$nc_dir/apps/user_oidc/appinfo/info.xml" ]; then
            ver=$(grep -oPm1 "(?<=<version>)[^<]+" "$nc_dir/apps/user_oidc/appinfo/info.xml" 2>/dev/null || echo "unknown")
            echo "NEXTCLOUD($nc_dir): user_oidc=$ver"
          else
            echo "NEXTCLOUD($nc_dir): user_oidc_not_installed"
          fi
        done
        [ "$found" -eq 0 ] && echo "nextcloud_not_found" || true
      args:
        executable: /bin/bash
      register: nextcloud_check
      changed_when: false
      check_mode: false
      tags: [nextcloud]

    - name: Проверка Nginx и Squid (BDU: 2026-08881, 2026-08611)
      ansible.builtin.shell: |
        set -o pipefail
        if command -v nginx >/dev/null 2>&1; then
          ng_v=$(nginx -v 2>&1)
          ng_m=$(nginx -V 2>&1 | tr ' ' '\n' | grep -E 'http_v2_module|http_grpc_module' | tr '\n' ',')
          echo "NGINX: $ng_v [Modules:${ng_m:-none}]"
        else
          echo "NGINX: not_in_path"
        fi
        if command -v squid >/dev/null 2>&1; then
          echo "SQUID: $(squid -v 2>&1 | head -n 1)"
        else
          echo "SQUID: not_in_path"
        fi
      args:
        executable: /bin/bash
      register: proxy_web_check
      changed_when: false
      check_mode: false
      tags: [proxy_web]

    - name: Формирование очищенной CSV-строки по результатам всех задач
      ansible.builtin.set_fact:
        host_csv_row: >-
          {{
            [
              ansible_facts.hostname | default(inventory_hostname),
              ansible_facts.fqdn | default(inventory_hostname),
              ansible_facts.default_ipv4.address | default('N/A'),
              ansible_facts.os_family | default('N/A'),
              (ansible_facts.distribution | default('')) ~ ' ' ~ (ansible_facts.distribution_version | default('')),
              ansible_facts.kernel | default('N/A'),
              installed_target_packages | default('N/A') | regex_replace('[\r\n]+', ' | ') | regex_replace(';', ','),
              kernel_check.stdout | default('N/A') | regex_replace('[\r\n]+', ' | ') | regex_replace(';', ','),
              act_runner_check.stdout | default('N/A') | regex_replace('[\r\n]+', ' | ') | regex_replace(';', ','),
              django_check.stdout | default('N/A') | regex_replace('[\r\n]+', ' | ') | regex_replace(';', ','),
              zimbra_check.stdout | default('N/A') | regex_replace('[\r\n]+', ' | ') | regex_replace(';', ','),
              media_check.stdout | default('N/A') | regex_replace('[\r\n]+', ' | ') | regex_replace(';', ','),
              nextcloud_check.stdout | default('N/A') | regex_replace('[\r\n]+', ' | ') | regex_replace(';', ','),
              proxy_web_check.stdout | default('N/A') | regex_replace('[\r\n]+', ' | ') | regex_replace(';', ',')
            ] | map(' regex_replace', '\"', "'") | map('trim') | join(';')
          }}
      tags: [always]

    - name: Создание локальной папки для отчетов на управляющем узле
      ansible.builtin.file:
        path: "{{ report_output_dir }}"
        state: directory
        mode: '0750'
      delegate_to: localhost
      become: false
      run_once: true
      tags: [always]

    - name: Сохранение индивидуального CSV-отчета по каждому хосту
      ansible.builtin.copy:
        content: |
          {{ csv_header }}
          {{ host_csv_row }}
        dest: "{{ report_output_dir }}/{{ inventory_hostname }}_bdu_audit.csv"
        mode: '0640'
      delegate_to: localhost
      become: false
      tags: [always]

    - name: Сохранение сводного CSV-отчета по всем хостам
      ansible.builtin.copy:
        content: |
          {{ csv_header }}
          {% for host in ansible_play_hosts %}
          {% if hostvars[host]['host_csv_row'] is defined %}
          {{ hostvars[host]['host_csv_row'] }}
          {% endif %}
          {% endfor %}
        dest: "{{ summary_csv_file }}"
        mode: '0640'
      delegate_to: localhost
      become: false
      run_once: true
      tags: [always]