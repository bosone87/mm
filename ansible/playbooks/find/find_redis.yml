---
- name: Поиск Redis на хостах и в контейнерах
  hosts: "{{ hosts | default('', true) | string | replace(';', ',') | split(',') | map('trim') | reject('equalto', '') | list }}"
  strategy: free
  gather_facts: true
  gather_subset:
    - "!all"
    - "!min"
    - "distribution"
    - "pkg_mgr"

  vars:
    audit_target: "redis"
    target_rpm_packages:
      - redis
      - redis6
      - redis-server
      - redis-stack-server
      - redis-stack
    target_deb_packages:
      - redis-server
      - redis
      - redis-sentinel
      - redis-stack-server
      - redis-stack
    # Ищем именно серверные бинарники, чтобы не ловить хосты только с клиентом redis-cli
    target_host_binaries:
      - redis-server
      - redis-sentinel
    # Ловит официальные образы redis, redis-stack, bitnami/redis, sentinel и др.
    target_container_regex: "(^|[/:_-])redis([/:_.-]|$)"
    target_version_cmd: "redis-server --version 2>/dev/null | head -n1"

  tasks:
    - name: Передать список целевых хостов на adm.lin
      ansible.builtin.set_fact:
        audited_hosts: "{{ ansible_play_hosts_all }}"
      delegate_to: adm.lin
      delegate_facts: true
      run_once: true

### Плейбук 4 — поиск Redis (`find_redis.yml`)

---
- name: Поиск Redis на хостах и в контейнерах
  hosts: "{{ hosts | default('', true) | string | replace(';', ',') | split(',') | map('trim') | reject('equalto', '') | list }}"
  strategy: free
  gather_facts: true
  gather_subset:
    - "!all"
    - "!min"
    - "distribution"
    - "pkg_mgr"

  vars:
    audit_target: "redis"
    target_rpm_packages:
      - redis
      - redis6
      - redis-stack-server
      - redis-server
    target_deb_packages:
      - redis-server
      - redis
      - redis-stack-server
    # Ищем именно серверный бинарник, чтобы исключить хосты, где стоит только redis-cli
    target_host_binaries:
      - redis-server
    target_container_regex: "(^|[/:_-])redis([/:_.-]|$)"
    target_version_cmd: "redis-server -v 2>/dev/null | head -n1"

  tasks:
    - name: Передать список целевых хостов на adm.lin
      ansible.builtin.set_fact:
        audited_hosts: "{{ ansible_play_hosts_all }}"
      delegate_to: adm.lin
      delegate_facts: true
      run_once: true

    - name: Выполнить проверку хоста и контейнеров
      ansible.builtin.import_tasks: tasks/audit_host_and_containers.yml

- name: Сохранить единый CSV-отчет по Redis на adm.lin
  hosts: adm.lin
  gather_facts: false
  vars:
    audit_target: "redis"
    report_dir: "/tmp/ansible_reports"
    csv_sep: ","
  tasks:
    - name: Сформировать и сохранить CSV-отчет
      ansible.builtin.import_tasks: tasks/save_csv_report.yml