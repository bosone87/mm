---
- name: Поиск Nginx на хостах и в контейнерах
  hosts: "{{ hosts | default('', true) | string | replace(';', ',') | split(',') | map('trim') | reject('equalto', '') | list }}"
  strategy: free
  gather_facts: true
  gather_subset:
    - "!all"
    - "!min"
    - "distribution"
    - "pkg_mgr"

  vars:
    audit_target: "nginx"
    target_rpm_packages:
      - nginx
      - nginx-core
      - nginx-plus
    target_deb_packages:
      - nginx
      - nginx-core
      - nginx-full
      - nginx-light
      - nginx-extras
      - nginx-plus
    target_host_binaries:
      - nginx
    target_container_regex: "(^|[/:_-])nginx([/:_.-]|$)"
    target_version_cmd: "nginx -v 2>&1 | head -n1"

  tasks:
    - name: Передать список целевых хостов на adm.lin
      ansible.builtin.set_fact:
        audited_hosts: "{{ ansible_play_hosts_all }}"
      delegate_to: adm.lin
      delegate_facts: true
      run_once: true

    - name: Выполнить проверку хоста и контейнеров
      ansible.builtin.import_tasks: tasks/audit_host_and_containers.yml

- name: Сохранить единый CSV-отчет по Nginx на adm.lin
  hosts: adm.lin
  gather_facts: false
  vars:
    audit_target: "nginx"
    report_dir: "/tmp/ansible_reports"
    csv_sep: ","
  tasks:
    - name: Сформировать и сохранить CSV-отчет
      ansible.builtin.import_tasks: tasks/save_csv_report.yml