---
- name: Аудит CVE-2026-45156 (Nextcloud user_oidc) на хостах и в контейнерах
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  gather_facts: false
  ignore_unreachable: true

  tasks:
    - name: Read-only сканирование хоста и контейнерных сред (один SSH-вызов)
      ansible.builtin.shell:
        executable: /bin/sh
        cmd: |
          {% raw %}
          set -u
          export LC_ALL=C

          run_to() {
            if command -v timeout >/dev/null 2>&1; then
              timeout 10 "$@"
            else
              "$@"
            fi
          }

          extract_ver() {
            sed -n 's/.*<version>\([^<]*\)<\/version>.*/\1/p' "$1" 2>/dev/null | head -n 1 | tr -d ' \t\r\n'
          }

          OS_ID="unknown"
          if [ -r /etc/os-release ]; then
            OS_ID=$(awk -F= '/^ID=/{gsub(/"/,"",$2); print $2; exit}' /etc/os-release 2>/dev/null)
          fi
          printf 'OS|%s\n' "${OS_ID:-unknown}"

          emit() {
            # FIND|runtime|target|image|path|version|state
            printf 'FIND|%s|%s|%s|%s|%s|%s\n' "$1" "$2" "$3" "$4" "$5" "$6"
          }

          # 1. Хостовые пути Nextcloud и стандартные директории томов (с -xdev и пропуском data/)
          HOST_PATHS="/var/www /srv /opt /usr/share/webapps /usr/share/nextcloud /var/snap/nextcloud /var/lib/docker/volumes /var/lib/containers/storage/volumes"
          for base in $HOST_PATHS; do
            [ -d "$base" ] || continue
            run_to find "$base" -xdev -maxdepth 8 \
              \( -name data -o -name .git \) -prune -o \
              -type f -path '*/user_oidc/appinfo/info.xml' -print 2>/dev/null | while IFS= read -r f; do
                [ -n "$f" ] || continue
                ver=$(extract_ver "$f")
                emit "host" "filesystem" "-" "$f" "${ver:-unknown}" "unknown"
            done
          done

          # 2. Контейнерные рантаймы: docker, podman, nerdctl
          for rt in docker podman nerdctl; do
            command -v "$rt" >/dev/null 2>&1 || continue
            run_to "$rt" ps -q >/dev/null 2>&1 || continue

            run_to "$rt" ps -a -q 2>/dev/null | while IFS= read -r cid; do
              [ -n "$cid" ] || continue
              meta=$(run_to "$rt" inspect --format '{{.Name}}|{{.Config.Image}}|{{.State.Status}}' "$cid" 2>/dev/null | sed 's|^/||')
              cname=$(printf '%s' "$meta" | cut -d'|' -f1)
              cimg=$(printf '%s' "$meta" | cut -d'|' -f2)
              cstatus=$(printf '%s' "$meta" | cut -d'|' -f3)

              # 2a. Проверка bind-монтирований на хосте (включая остановленные контейнеры)
              run_to "$rt" inspect --format '{{range .Mounts}}{{if eq .Type "bind"}}{{.Source}}{{"\n"}}{{end}}{{end}}' "$cid" 2>/dev/null | while IFS= read -r msrc; do
                [ -d "$msrc" ] || continue
                case "$msrc" in
                  /|/etc|/var|/usr|/proc|/sys|/dev|/run|/tmp) continue ;;
                esac
                run_to find "$msrc" -xdev -maxdepth 5 \
                  \( -name data -o -name .git \) -prune -o \
                  -type f -path '*/user_oidc/appinfo/info.xml' -print 2>/dev/null | while IFS= read -r f; do
                    [ -n "$f" ] || continue
                    ver=$(extract_ver "$f")
                    emit "$rt" "${cname}(${cstatus})" "$cimg" "bind:${f}" "${ver:-unknown}" "unknown"
                done
              done

              # 2b. Проверка внутри запущенного контейнера (модули в образе/overlay + статус через occ)
              if [ "$cstatus" = "running" ]; then
                in_res=$(run_to "$rt" exec "$cid" sh -c '
                  found=0
                  for base in /var/www/html /var/www/nextcloud /config/www/nextcloud /usr/src/nextcloud /app/www/public; do
                    [ -d "$base" ] || continue
                    if [ -f "$base/occ" ] || [ -f "$base/version.php" ]; then
                      find "$base" -xdev -maxdepth 4 \( -name data -o -name .git \) -prune -o \
                        -type f -path "*/user_oidc/appinfo/info.xml" -print 2>/dev/null | while IFS= read -r p; do
                          [ -r "$p" ] || continue
                          v=$(sed -n "s/.*<version>\([^<]*\)<\/version>.*/\1/p" "$p" 2>/dev/null | head -n 1 | tr -d " \t\r\n")
                          echo "${p}|${v:-unknown}"
                      done
                      found=1
                    fi
                  done
                  if [ "$found" -eq 0 ]; then
                    for p in \
                      /var/www/html/custom_apps/user_oidc/appinfo/info.xml \
                      /var/www/html/apps/user_oidc/appinfo/info.xml \
                      /config/www/nextcloud/apps/user_oidc/appinfo/info.xml; do
                      if [ -r "$p" ]; then
                        v=$(sed -n "s/.*<version>\([^<]*\)<\/version>.*/\1/p" "$p" 2>/dev/null | head -n 1 | tr -d " \t\r\n")
                        echo "${p}|${v:-unknown}"
                      fi
                    done
                  fi
                ' 2>/dev/null)

                if [ -n "$in_res" ]; then
                  app_state="unknown"
                  # Определяем UID владельца occ, чтобы НЕ запускать php occ от root
                  occ_info=$(run_to "$rt" exec "$cid" sh -c '
                    for o in /var/www/html/occ /var/www/nextcloud/occ /config/www/nextcloud/occ /app/www/public/occ; do
                      if [ -f "$o" ]; then
                        u=$(stat -c "%u" "$o" 2>/dev/null || ls -ln "$o" 2>/dev/null | awk "{print \$3}")
                        echo "${u}|${o}"
                        break
                      fi
                    done
                  ' 2>/dev/null | head -n 1)

                  occ_uid=$(printf '%s' "$occ_info" | cut -d'|' -f1)
                  occ_path=$(printf '%s' "$occ_info" | cut -d'|' -f2)

                  case "$occ_uid" in
                    ''|0|*[!0-9]*) ;;
                    *)
                      occ_out=$(run_to "$rt" exec -u "$occ_uid" "$cid" php "$occ_path" app:list --no-ansi 2>/dev/null)
                      if [ -n "$occ_out" ]; then
                        app_state=$(printf '%s\n' "$occ_out" | awk '
                          /^Enabled:/ { sec="enabled"; next }
                          /^Disabled:/ { sec="disabled"; next }
                          /^[[:space:]]*-[[:space:]]*user_oidc:/ { print sec; exit }
                        ')
                        [ -n "$app_state" ] || app_state="not_registered"
                      fi
                      ;;
                  esac

                  printf '%s\n' "$in_res" | while IFS='|' read -r ipath iver; do
                    [ -n "$ipath" ] || continue
                    emit "$rt" "${cname}(running)" "$cimg" "$ipath" "$iver" "$app_state"
                  done
                fi
              fi
            done
          done

          exit 0
          {% endraw %}
      register: scan_raw
      changed_when: false
      check_mode: false
      failed_when: false

    - name: Классификация версий user_oidc по CVE-2026-45156
      ansible.builtin.set_fact:
        cve_findings: >-
          {%- set lines = scan_raw.stdout_lines | default([]) -%}
          {%- set os_val = 'unknown' -%}
          {%- set raw_finds = [] -%}
          {%- for l in lines -%}
            {%- if l.startswith('OS|') -%}
              {%- set os_val = l.split('|', 1)[1] -%}
            {%- elif l.startswith('FIND|') -%}
              {%- set _ = raw_finds.append(l) -%}
            {%- endif -%}
          {%- endfor -%}
          {%- set rows = [] -%}
          {%- if scan_raw.rc | default(1) != 0 -%}
            {%- set _ = rows.append({
              'host': inventory_hostname,
              'os': os_val,
              'runtime': '-',
              'target': '-',
              'image': '-',
              'path': '-',
              'version': '-',
              'app_state': '-',
              'cve_status': 'SCAN_ERROR',
              'details': (scan_raw.stderr | default('script execution failed') | replace('\n', ' ') | trim)[:150]
            }) -%}
          {%- elif raw_finds | length == 0 -%}
            {%- set _ = rows.append({
              'host': inventory_hostname,
              'os': os_val,
              'runtime': '-',
              'target': '-',
              'image': '-',
              'path': '-',
              'version': '-',
              'app_state': '-',
              'cve_status': 'NOT_FOUND',
              'details': 'user_oidc not detected'
            }) -%}
          {%- else -%}
            {%- for item in (raw_finds | unique) -%}
              {%- set p = item.split('|') -%}
              {%- set v = p[5] | default('unknown') -%}
              {%- if v == 'unknown' or not (v is match('^[0-9]+(\\.[0-9]+)+([-.][A-Za-z0-9]+)?$')) -%}
                {%- set status = 'UNKNOWN_VERSION' -%}
                {%- set details = 'Cannot parse version; manual verification required' -%}
              {%- elif (v is ansible.builtin.version('0.3.0', '>=') and v is ansible.builtin.version('3.1.0', '<'))
                    or (v is ansible.builtin.version('4.0.0', '>=') and v is ansible.builtin.version('4.1.0', '<'))
                    or (v is ansible.builtin.version('5.0.0', '>=') and v is ansible.builtin.version('5.1.0', '<'))
                    or (v is ansible.builtin.version('6.0.0', '>=') and v is ansible.builtin.version('6.4.0', '<')) -%}
                {%- set status = 'VULNERABLE' -%}
                {%- set details = 'Update user_oidc to >=3.1.0 / 4.1.0 / 5.1.0 / 6.4.0' -%}
              {%- else -%}
                {%- set status = 'PATCHED' -%}
                {%- set details = 'Version outside vulnerable ranges' -%}
              {%- endif -%}
              {%- set _ = rows.append({
                'host': inventory_hostname,
                'os': os_val,
                'runtime': p[1] | default('-'),
                'target': p[2] | default('-'),
                'image': p[3] | default('-'),
                'path': p[4] | default('-'),
                'version': v,
                'app_state': p[6] | default('unknown'),
                'cve_status': status,
                'details': details
              }) -%}
            {%- endfor -%}
          {%- endif -%}
          {{ rows }}

- name: Формирование сводки на экран и сохранение CSV-отчёта на adm.lin
  hosts: "{{ report_host | default('adm.lin') }}"
  gather_facts: true
  vars:
    target_hosts: "all"
    report_dir: "{{ ansible_env.HOME }}/cve-reports"
    include_clean_hosts: true

  tasks:
    - name: Определение пути файла отчёта и объединение результатов
      ansible.builtin.set_fact:
        report_file: "{{ report_dir }}/cve-2026-45156_{{ ansible_date_time.iso8601_basic_short }}.csv"
        all_findings: >-
          {%- set combined = [] -%}
          {%- for h in query('inventory_hostnames', target_hosts) -%}
            {%- if hostvars[h].cve_findings is defined -%}
              {%- for row in hostvars[h].cve_findings -%}
                {%- set _ = combined.append(row) -%}
              {%- endfor -%}
            {%- else -%}
              {%- set _ = combined.append({
                'host': h,
                'os': 'unknown',
                'runtime': '-',
                'target': '-',
                'image': '-',
                'path': '-',
                'version': '-',
                'app_state': '-',
                'cve_status': 'UNREACHABLE',
                'details': 'Host unreachable or skipped'
              }) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ combined }}

    - name: Создание директории для отчётов на adm.lin
      ansible.builtin.file:
        path: "{{ report_dir }}"
        state: directory
        mode: "0750"

    - name: Сохранение CSV-отчёта на adm.lin
      ansible.builtin.copy:
        dest: "{{ report_file }}"
        mode: "0640"
        content: |
          host,os,runtime,target,image,path,version,app_state,cve_status,details
          {%- macro q(v) -%}"{{ (v | string) | replace('"', '""') }}"{%- endmacro -%}
          {%- for r in all_findings -%}
            {%- if include_clean_hosts | bool or r.cve_status != 'NOT_FOUND' %}
          {{ q(r.host) }},{{ q(r.os) }},{{ q(r.runtime) }},{{ q(r.target) }},{{ q(r.image) }},{{ q(r.path) }},{{ q(r.version) }},{{ q(r.app_state) }},{{ q(r.cve_status) }},{{ q(r.details) }}
            {%- endif -%}
          {%- endfor %}

    - name: Подготовка текстовой сводки для вывода в консоль
      ansible.builtin.set_fact:
        summary_lines: >-
          {%- set vuln = all_findings | selectattr('cve_status', 'equalto', 'VULNERABLE') | list -%}
          {%- set unk = all_findings | selectattr('cve_status', 'equalto', 'UNKNOWN_VERSION') | list -%}
          {%- set patched = all_findings | selectattr('cve_status', 'equalto', 'PATCHED') | list -%}
          {%- set err = all_findings | selectattr('cve_status', 'in', ['UNREACHABLE', 'SCAN_ERROR']) | list -%}
          {%- set lines = [
            '============================================================',
            'CVE-2026-45156 (Nextcloud user_oidc) — Итоги аудита',
            'Хостов в выборке: ' ~ (query('inventory_hostnames', target_hosts) | length),
            'VULNERABLE:       ' ~ (vuln | length),
            'UNKNOWN_VERSION:  ' ~ (unk | length),
            'PATCHED:          ' ~ (patched | length),
            'UNREACHABLE/ERR:  ' ~ (err | length),
            'CSV-отчёт:        ' ~ inventory_hostname ~ ':' ~ report_file,
            '============================================================'
          ] -%}
          {%- if vuln | length > 0 -%}
            {%- set _ = lines.append('--- УЯЗВИМЫЕ ИНСТАНСЫ ---') -%}
            {%- for r in vuln -%}
              {%- set _ = lines.append('[VULNERABLE] ' ~ r.host ~ ' | ' ~ r.runtime ~ ':' ~ r.target ~ ' | ver=' ~ r.version ~ ' | state=' ~ r.app_state ~ ' | ' ~ r.path) -%}
            {%- endfor -%}
          {%- endif -%}
          {%- if unk | length > 0 -%}
            {%- set _ = lines.append('--- ТРЕБУЕТСЯ РУЧНАЯ ПРОВЕРКА ---') -%}
            {%- for r in unk -%}
              {%- set _ = lines.append('[UNKNOWN] ' ~ r.host ~ ' | ' ~ r.runtime ~ ':' ~ r.target ~ ' | ' ~ r.path) -%}
            {%- endfor -%}
          {%- endif -%}
          {%- if err | length > 0 -%}
            {%- set _ = lines.append('--- НЕДОСТУПНЫЕ / ОШИБКИ ---') -%}
            {%- for r in err -%}
              {%- set _ = lines.append('[' ~ r.cve_status ~ '] ' ~ r.host ~ ' | ' ~ r.details) -%}
            {%- endfor -%}
          {%- endif -%}
          {{ lines }}

    - name: Вывод результатов аудита на экран
      ansible.builtin.debug:
        msg: "{{ summary_lines }}"