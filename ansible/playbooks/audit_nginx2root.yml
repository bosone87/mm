---
- name: Безопасный read-only аудит NGINX2Root и модуля ядра SCTP (хост и контейнеры)
  hosts: all
  become: true
  gather_facts: true
  vars:
    report_host: "adm.lin"
    report_dir: "/var/tmp/nginx2root_audit"
    cmd_timeout: 10

  tasks:
    - name: Сформировать единую временную метку для файла отчёта
      ansible.builtin.set_fact:
        audit_timestamp: "{{ ansible_date_time.date }}_{{ ansible_date_time.hour }}{{ ansible_date_time.minute }}"
      run_once: true
      delegate_to: localhost
      delegate_facts: true

    - name: Задать путь к итоговому CSV-файлу
      ansible.builtin.set_fact:
        report_file: "{{ report_dir }}/nginx2root_audit_{{ hostvars['localhost']['audit_timestamp'] }}.csv"

    - name: Выполнить read-only сбор данных по NGINX и SCTP на хосте и в контейнерах
      ansible.builtin.shell:
        cmd: |
          set -uo pipefail
          SEP=$'\x1f'
          TO="{{ cmd_timeout }}"

          run_to() {
            if command -v timeout >/dev/null 2>&1; then
              timeout "${TO}" "$@" </dev/null
            else
              "$@" </dev/null
            fi
          }

          is_patched() {
            local maj min pat
            IFS='.' read -r maj min pat _ <<< "$1"
            [[ "$maj" =~ ^[0-9]+$ && "$min" =~ ^[0-9]+$ && "$pat" =~ ^[0-9]+$ ]] || return 1
            if [ "$maj" -gt 1 ] || { [ "$maj" -eq 1 ] && [ "$min" -ge 32 ]; }; then return 0; fi
            if [ "$maj" -eq 1 ] && [ "$min" -eq 30 ] && [ "$pat" -ge 7 ]; then return 0; fi
            if [ "$maj" -eq 1 ] && [ "$min" -eq 31 ] && [ "$pat" -ge 9 ]; then return 0; fi
            return 1
          }

          calc_risk() {
            local has_ngx="$1" ver="$2" h2="$3" h3="$4" mail="$5" dyn="$6" mir="$7" ssi="$8" sctp_l="$9"
            if [ "$has_ngx" = "NO" ]; then
              [[ "$sctp_l" == YES* ]] && echo "MEDIUM_SCTP_LOADED_NO_NGINX" || echo "LOW_NO_NGINX"
              return
            fi
            if [ "$has_ngx" = "NO_SHELL_OR_BIN" ]; then
              echo "REVIEW_DISTROLESS_CONTAINER"
              return
            fi
            if is_patched "$ver"; then
              [[ "$sctp_l" == YES* ]] && echo "LOW_NGINX_PATCHED_CHECK_SCTP" || echo "OK_PATCHED"
              return
            fi
            if [ "$h2" = "YES" ] || [ "$h3" = "YES" ] || [ "$mail" = "YES" ] || { [ "$dyn" = "YES" ] && { [ "$mir" = "YES" ] || [ "$ssi" = "YES" ]; }; }; then
              [[ "$sctp_l" == YES* ]] && echo "CRITICAL_ACTIVE_VECTOR_AND_SCTP" || echo "CRITICAL_ACTIVE_VECTOR"
              return
            fi
            if [ "$h2" = "ERR" ]; then
              echo "REVIEW_NGINX_CFG_ERROR"
              return
            fi
            echo "MEDIUM_VULN_VER_NO_ACTIVE_VECTOR"
          }

          # 1. Проверка модуля SCTP на ядре хоста
          SCTP_LOADED="NO"
          if lsmod 2>/dev/null | awk '$1 == "sctp" { found=1 } END { exit (found ? 0 : 1) }'; then
            SCTP_LOADED="YES"
          elif [ -d /sys/module/sctp ]; then
            SCTP_LOADED="YES_SYSFS"
          fi

          MODPROBE_HITS=$(grep -rnE '^[[:space:]]*(blacklist|install)[[:space:]]+sctp\b' /etc/modprobe.d/ 2>/dev/null | tr '\n' ',' | sed 's/,$//')
          [ -z "$MODPROBE_HITS" ] && MODPROBE_HITS="NONE"

          # 2. Анализ конфигурации NGINX без учёта комментариев
          analyze_nginx_cfg() {
            local CLEAN_CFG
            CLEAN_CFG=$(printf '%s\n' "$1" | sed -E 's/^[[:space:]]*#.*$//')
            local H2 H3 MAIL DYN MIR SSI RES
            H2=$(printf '%s\n' "$CLEAN_CFG" | grep -Eq '(^|[[:space:]])http2([[:space:];]|$)|http2[[:space:]]+on' && echo YES || echo NO)
            H3=$(printf '%s\n' "$CLEAN_CFG" | grep -Eq '(^|[[:space:]])quic([[:space:];]|$)|http3' && echo YES || echo NO)
            MAIL=$(printf '%s\n' "$CLEAN_CFG" | grep -Eq '^[[:space:]]*mail[[:space:]]*\{' && echo YES || echo NO)
            DYN=$(printf '%s\n' "$CLEAN_CFG" | grep -Eq 'proxy_pass[[:space:]]+[^;]*\$' && echo YES || echo NO)
            MIR=$(printf '%s\n' "$CLEAN_CFG" | grep -Eq '(^|[[:space:]])mirror[[:space:]]+[^;]+;' && echo YES || echo NO)
            SSI=$(printf '%s\n' "$CLEAN_CFG" | grep -Eq '(^|[[:space:]])ssi[[:space:]]+on;' && echo YES || echo NO)
            RES=$(printf '%s\n' "$CLEAN_CFG" | grep -Eq '(^|[[:space:]])resolver[[:space:]]+[^;]+;' && echo YES || echo NO)
            printf "%s%s%s%s%s%s%s%s%s%s%s%s%s" "$H2" "$SEP" "$H3" "$SEP" "$MAIL" "$SEP" "$DYN" "$SEP" "$MIR" "$SEP" "$SSI" "$SEP" "$RES"
          }

          # 3. Разбор версии и модулей NGINX
          parse_nginx_v() {
            local V_OUT="$1"
            local VER V2 V3 ML
            VER=$(printf '%s\n' "$V_OUT" | sed -n 's/.*nginx version: nginx\/\([0-9.]*\).*/\1/p' | head -n1)
            [ -z "$VER" ] && VER="UNKNOWN"
            printf '%s' "$V_OUT" | grep -q -- '--with-http_v2_module' && V2="Y" || V2="N"
            printf '%s' "$V_OUT" | grep -q -- '--with-http_v3_module' && V3="Y" || V3="N"
            printf '%s' "$V_OUT" | grep -q -- '--with-mail' && ML="Y" || ML="N"
            printf "%s%sv2=%s,v3=%s,mail=%s" "$VER" "$SEP" "$V2" "$V3" "$ML"
          }

          emit_row() {
            local RISK
            RISK=$(calc_risk "$3" "$4" "$6" "$7" "$8" "$9" "${10}" "${11}" "${13}")
            printf "%s%s%s%s%s%s%s%s%s%s%s%s%s%s%s%s%s%s%s%s%s%s%s%s%s%s%s%s%s\n" \
              "$1" "$SEP" "$2" "$SEP" "$3" "$SEP" "$4" "$SEP" "$5" "$SEP" \
              "$6" "$SEP" "$7" "$SEP" "$8" "$SEP" "$9" "$SEP" "${10}" "$SEP" \
              "${11}" "$SEP" "${12}" "$SEP" "${13}" "$SEP" "${14}" "$SEP" "$RISK"
          }

          # 4. Аудит хоста
          if command -v nginx >/dev/null 2>&1; then
            V_RAW=$(run_to nginx -V 2>&1 || true)
            IFS="$SEP" read -r VER MODS <<< "$(parse_nginx_v "$V_RAW")"
            CFG_RAW=$(run_to nginx -T 2>/dev/null || true)
            if [ -n "$CFG_RAW" ]; then
              IFS="$SEP" read -r H2 H3 MAIL DYN MIR SSI RES <<< "$(analyze_nginx_cfg "$CFG_RAW")"
            else
              H2="ERR"; H3="ERR"; MAIL="ERR"; DYN="ERR"; MIR="ERR"; SSI="ERR"; RES="ERR"
            fi
            emit_row "host" "nginx_bin" "YES" "$VER" "$MODS" "$H2" "$H3" "$MAIL" "$DYN" "$MIR" "$SSI" "$RES" "$SCTP_LOADED" "$MODPROBE_HITS"
          else
            emit_row "host" "nginx_bin" "NO" "N/A" "N/A" "N/A" "N/A" "N/A" "N/A" "N/A" "N/A" "N/A" "$SCTP_LOADED" "$MODPROBE_HITS"
          fi

          # 5. Аудит запущенных контейнеров Docker и Podman
          for RT in docker podman; do
            if command -v "$RT" >/dev/null 2>&1; then
              while IFS=$'\t' read -r CID CNAME CIMAGE; do
                [ -z "$CID" ] && continue
                HAS_NGX="NO"
                if run_to "$RT" exec "$CID" sh -c 'command -v nginx >/dev/null 2>&1' 2>/dev/null; then
                  HAS_NGX="YES"
                elif printf '%s' "$CIMAGE" | grep -qiE 'nginx|ingress'; then
                  HAS_NGX="IMAGE_MATCH"
                fi

                if [ "$HAS_NGX" = "YES" ]; then
                  V_RAW=$(run_to "$RT" exec "$CID" nginx -V 2>&1 || true)
                  IFS="$SEP" read -r VER MODS <<< "$(parse_nginx_v "$V_RAW")"
                  CFG_RAW=$(run_to "$RT" exec "$CID" nginx -T 2>/dev/null || true)
                  if [ -n "$CFG_RAW" ]; then
                    IFS="$SEP" read -r H2 H3 MAIL DYN MIR SSI RES <<< "$(analyze_nginx_cfg "$CFG_RAW")"
                  else
                    H2="ERR"; H3="ERR"; MAIL="ERR"; DYN="ERR"; MIR="ERR"; SSI="ERR"; RES="ERR"
                  fi
                  emit_row "${RT}:${CNAME}" "$CIMAGE" "YES" "$VER" "$MODS" "$H2" "$H3" "$MAIL" "$DYN" "$MIR" "$SSI" "$RES" "$SCTP_LOADED" "$MODPROBE_HITS"
                elif [ "$HAS_NGX" = "IMAGE_MATCH" ]; then
                  emit_row "${RT}:${CNAME}" "$CIMAGE" "NO_SHELL_OR_BIN" "N/A" "N/A" "N/A" "N/A" "N/A" "N/A" "N/A" "N/A" "N/A" "$SCTP_LOADED" "$MODPROBE_HITS"
                fi
              done < <(run_to "$RT" ps --format '{% raw %}{{.ID}}\t{{.Names}}\t{{.Image}}{% endraw %}' 2>/dev/null || true)
            fi
          done
      args:
        executable: /bin/bash
      register: audit_rows
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Создать каталог отчётов на центральном сервере adm.lin
      ansible.builtin.file:
        path: "{{ report_dir }}"
        state: directory
        mode: "0750"
      delegate_to: "{{ report_host }}"
      run_once: true
      check_mode: false

    - name: Сохранить единый CSV-отчёт (UTF-8 с BOM) на adm.lin через ansible.builtin.copy
      ansible.builtin.copy:
        dest: "{{ report_file }}"
        mode: "0640"
        content: |
          {%- macro cell(val) -%}
            {%- set s = (val | default('') | string | replace('\r', ' ') | replace('\n', ' ')) -%}
            {%- if s[:1] in ['=', '+', '-', '@', '\t'] -%}
              {%- set s = "'" ~ s -%}
            {%- endif -%}
            {%- if ';' in s or '"' in s -%}
              "{{ s | replace('"', '""') }}"
            {%- else -%}
              {{ s }}
            {%- endif -%}
          {%- endmacro -%}
          {{ '\ufeff' }}host;ip;os_distribution;kernel;target;image_or_bin;nginx_found;nginx_version;nginx_modules;http2_active;http3_quic_active;mail_block_active;dyn_proxy_pass;mirror_active;ssi_on_active;resolver_active;sctp_loaded;sctp_modprobe_rules;risk_status
          {% for h in ansible_play_hosts %}
          {% set hv = hostvars[h] %}
          {% set h_ip = (hv.ansible_default_ipv4.address if (hv.ansible_default_ipv4 is defined and hv.ansible_default_ipv4.address is defined) else 'N/A') %}
          {% set h_os = (hv.ansible_distribution | default('N/A')) ~ ' ' ~ (hv.ansible_distribution_version | default('')) %}
          {% set h_kernel = hv.ansible_kernel | default('N/A') %}
          {% if hv.audit_rows is defined and hv.audit_rows.stdout_lines is defined %}
          {% for line in hv.audit_rows.stdout_lines if line | trim | length > 0 %}
          {% set p = line.split('\x1f') %}
          {% if p | length >= 15 %}
          {{ cell(h) }};{{ cell(h_ip) }};{{ cell(h_os | trim) }};{{ cell(h_kernel) }};{{ cell(p[0]) }};{{ cell(p[1]) }};{{ cell(p[2]) }};{{ cell(p[3]) }};{{ cell(p[4]) }};{{ cell(p[5]) }};{{ cell(p[6]) }};{{ cell(p[7]) }};{{ cell(p[8]) }};{{ cell(p[9]) }};{{ cell(p[10]) }};{{ cell(p[11]) }};{{ cell(p[12]) }};{{ cell(p[13]) }};{{ cell(p[14]) }}
          {% endif %}
          {% endfor %}
          {% endif %}
          {% endfor %}
      delegate_to: "{{ report_host }}"
      run_once: true
      check_mode: false
      
    - name: Собрать сводку по хостам и объектам со статусом CRITICAL
      ansible.builtin.set_fact:
        critical_summary: >-
          {%- set ns = namespace(hosts=[], details=[]) -%}
          {%- for h in ansible_play_hosts -%}
            {%- set hv = hostvars[h] -%}
            {%- if hv.audit_rows is defined and hv.audit_rows.stdout_lines is defined -%}
              {%- for line in hv.audit_rows.stdout_lines if line | trim | length > 0 -%}
                {%- set p = line.split('\x1f') -%}
                {%- if p | length >= 15 and p[14].startswith('CRITICAL') -%}
                  {%- if h not in ns.hosts -%}
                    {%- set _ = ns.hosts.append(h) -%}
                  {%- endif -%}
                  {%- set _ = ns.details.append(h ~ ' [' ~ p[0] ~ '] — ' ~ p[14]) -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endif -%}
          {%- endfor -%}
          {{ {'hosts': ns.hosts, 'details': ns.details} }}
      run_once: true

    - name: Вывести итоговую сводку по CRITICAL и путь к отчёту в консоль
      ansible.builtin.debug:
        msg: >-
          {{
            [
              'Аудит завершён. Единый отчёт сохранён на ' ~ report_host ~ ': ' ~ report_file,
              'Проверено хостов: ' ~ (ansible_play_hosts | length),
              'Хостов со статусом CRITICAL: ' ~ (critical_summary['hosts'] | length),
              'Список хостов CRITICAL: ' ~ (critical_summary['hosts'] | join(', ') if critical_summary['hosts'] | length > 0 else 'нет'),
              'Детализация по объектам CRITICAL:' if critical_summary['details'] | length > 0 else 'Объектов со статусом CRITICAL не обнаружено.'
            ] + critical_summary['details']
          }}
      run_once: true
      
    - name: Вывести путь к сформированному отчёту в лог запуска
      ansible.builtin.debug:
        msg: "Аудит завершён. Единый отчёт сохранён на {{ report_host }}: {{ report_file }}"
      run_once: true