---
- name: Безопасный read-only аудит NGINX2Root и модуля ядра SCTP (хост и контейнеры)
  hosts: all
  become: true
  gather_facts: true
  vars:
    report_host: "adm.lin"
    report_dir: "/var/tmp/nginx2root_audit"
    cmd_timeout: 10

  tasks:
    - name: Сформировать единую временную метку для файла отчёта
      ansible.builtin.set_fact:
        audit_timestamp: "{{ ansible_date_time.date }}_{{ ansible_date_time.hour }}{{ ansible_date_time.minute }}"
      run_once: true
      delegate_to: localhost
      delegate_facts: true
      check_mode: false

    - name: Задать путь к итоговому CSV-файлу
      ansible.builtin.set_fact:
        report_file: "{{ report_dir }}/nginx2root_audit_{{ hostvars['localhost']['audit_timestamp'] }}.csv"
      check_mode: false

    - name: Выполнить read-only сбор данных по NGINX и SCTP на хосте и в контейнерах
      ansible.builtin.shell:
        cmd: |
          set -uo pipefail
          SEP=$'\x1f'
          TO="{{ cmd_timeout }}"

          run_to() {
            if command -v timeout >/dev/null 2>&1; then
              timeout "${TO}" "$@" </dev/null
            else
              "$@" </dev/null
            fi
          }

          # 1. Проверка модуля SCTP на ядре хоста (общее для хоста и контейнеров)
          SCTP_LOADED="NO"
          if lsmod 2>/dev/null | awk '$1 == "sctp" { found=1 } END { exit (found ? 0 : 1) }'; then
            SCTP_LOADED="YES"
          elif [ -d /sys/module/sctp ]; then
            SCTP_LOADED="YES_SYSFS"
          fi

          MODPROBE_HITS=$(grep -rnE '^[[:space:]]*(blacklist|install)[[:space:]]+sctp\b' /etc/modprobe.d/ 2>/dev/null | tr '\n' ';' | sed 's/;$//')
          [ -z "$MODPROBE_HITS" ] && MODPROBE_HITS="NONE"

          # 2. Анализ конфигурации NGINX без учёта закомментированных строк
          analyze_nginx_cfg() {
            local CLEAN_CFG
            CLEAN_CFG=$(printf '%s\n' "$1" | sed -E 's/^[[:space:]]*#.*$//')
            local H2 H3 MAIL DYN MIR SSI RES
            H2=$(printf '%s\n' "$CLEAN_CFG" | grep -Eq '(^|[[:space:]])http2([[:space:];]|$)|http2[[:space:]]+on' && echo YES || echo NO)
            H3=$(printf '%s\n' "$CLEAN_CFG" | grep -Eq '(^|[[:space:]])quic([[:space:];]|$)|http3' && echo YES || echo NO)
            MAIL=$(printf '%s\n' "$CLEAN_CFG" | grep -Eq '^[[:space:]]*mail[[:space:]]*\{' && echo YES || echo NO)
            DYN=$(printf '%s\n' "$CLEAN_CFG" | grep -Eq 'proxy_pass[[:space:]]+[^;]*\$' && echo YES || echo NO)
            MIR=$(printf '%s\n' "$CLEAN_CFG" | grep -Eq '(^|[[:space:]])mirror[[:space:]]+[^;]+;' && echo YES || echo NO)
            SSI=$(printf '%s\n' "$CLEAN_CFG" | grep -Eq '(^|[[:space:]])ssi[[:space:]]+on;' && echo YES || echo NO)
            RES=$(printf '%s\n' "$CLEAN_CFG" | grep -Eq '(^|[[:space:]])resolver[[:space:]]+[^;]+;' && echo YES || echo NO)
            printf "%s%s%s%s%s%s%s%s%s%s%s%s%s" "$H2" "$SEP" "$H3" "$SEP" "$MAIL" "$SEP" "$DYN" "$SEP" "$MIR" "$SEP" "$SSI" "$SEP" "$RES"
          }

          # 3. Разбор версии и собранных модулей NGINX
          parse_nginx_v() {
            local V_OUT="$1"
            local VER V2 V3 ML
            VER=$(printf '%s\n' "$V_OUT" | sed -n 's/.*nginx version: nginx\/\([0-9.]*\).*/\1/p' | head -n1)
            [ -z "$VER" ] && VER="UNKNOWN"
            printf '%s' "$V_OUT" | grep -q -- '--with-http_v2_module' && V2="Y" || V2="N"
            printf '%s' "$V_OUT" | grep -q -- '--with-http_v3_module' && V3="Y" || V3="N"
            printf '%s' "$V_OUT" | grep -q -- '--with-mail' && ML="Y" || ML="N"
            printf "%s%sv2=%s;v3=%s;mail=%s" "$VER" "$SEP" "$V2" "$V3" "$ML"
          }

          emit_row() {
            printf "%s%s%s%s%s%s%s%s%s%s%s%s%s%s%s%s%s%s%s%s%s%s%s%s%s%s%s\n" \
              "$1" "$SEP" "$2" "$SEP" "$3" "$SEP" "$4" "$SEP" "$5" "$SEP" \
              "$6" "$SEP" "$7" "$SEP" "$8" "$SEP" "$9" "$SEP" "${10}" "$SEP" \
              "${11}" "$SEP" "${12}" "$SEP" "${13}" "$SEP" "${14}"
          }

          # 4. Аудит хоста
          if command -v nginx >/dev/null 2>&1; then
            V_RAW=$(run_to nginx -V 2>&1 || true)
            IFS="$SEP" read -r VER MODS <<< "$(parse_nginx_v "$V_RAW")"
            CFG_RAW=$(run_to nginx -T 2>/dev/null || true)
            if [ -n "$CFG_RAW" ]; then
              IFS="$SEP" read -r H2 H3 MAIL DYN MIR SSI RES <<< "$(analyze_nginx_cfg "$CFG_RAW")"
            else
              H2="ERR"; H3="ERR"; MAIL="ERR"; DYN="ERR"; MIR="ERR"; SSI="ERR"; RES="ERR"
            fi
            emit_row "host" "nginx_bin" "YES" "$VER" "$MODS" "$H2" "$H3" "$MAIL" "$DYN" "$MIR" "$SSI" "$RES" "$SCTP_LOADED" "$MODPROBE_HITS"
          else
            emit_row "host" "nginx_bin" "NO" "N/A" "N/A" "N/A" "N/A" "N/A" "N/A" "N/A" "N/A" "N/A" "$SCTP_LOADED" "$MODPROBE_HITS"
          fi

          # 5. Аудит запущенных контейнеров Docker и Podman
          for RT in docker podman; do
            if command -v "$RT" >/dev/null 2>&1; then
              while IFS=$'\t' read -r CID CNAME CIMAGE; do
                [ -z "$CID" ] && continue
                HAS_NGX="NO"
                if run_to "$RT" exec "$CID" sh -c 'command -v nginx >/dev/null 2>&1' 2>/dev/null; then
                  HAS_NGX="YES"
                elif printf '%s' "$CIMAGE" | grep -qiE 'nginx|ingress'; then
                  HAS_NGX="IMAGE_MATCH"
                fi

                if [ "$HAS_NGX" = "YES" ]; then
                  V_RAW=$(run_to "$RT" exec "$CID" nginx -V 2>&1 || true)
                  IFS="$SEP" read -r VER MODS <<< "$(parse_nginx_v "$V_RAW")"
                  CFG_RAW=$(run_to "$RT" exec "$CID" nginx -T 2>/dev/null || true)
                  if [ -n "$CFG_RAW" ]; then
                    IFS="$SEP" read -r H2 H3 MAIL DYN MIR SSI RES <<< "$(analyze_nginx_cfg "$CFG_RAW")"
                  else
                    H2="ERR"; H3="ERR"; MAIL="ERR"; DYN="ERR"; MIR="ERR"; SSI="ERR"; RES="ERR"
                  fi
                  emit_row "${RT}:${CNAME}" "$CIMAGE" "YES" "$VER" "$MODS" "$H2" "$H3" "$MAIL" "$DYN" "$MIR" "$SSI" "$RES" "$SCTP_LOADED" "$MODPROBE_HITS"
                elif [ "$HAS_NGX" = "IMAGE_MATCH" ]; then
                  emit_row "${RT}:${CNAME}" "$CIMAGE" "NO_SHELL_OR_BIN" "N/A" "N/A" "N/A" "N/A" "N/A" "N/A" "N/A" "N/A" "N/A" "$SCTP_LOADED" "$MODPROBE_HITS"
                fi
              done < <(run_to "$RT" ps --format '{{.ID}}\t{{.Names}}\t{{.Image}}' 2>/dev/null || true)
            fi
          done
      args:
        executable: /bin/bash
      register: audit_rows
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Создать каталог отчётов на центральном сервере adm.lin
      ansible.builtin.file:
        path: "{{ report_dir }}"
        state: directory
        mode: "0750"
      delegate_to: "{{ report_host }}"
      run_once: true
      check_mode: false

    - name: Записать результаты аудита в CSV (UTF-8 с BOM) на adm.lin с блокировкой файла
      ansible.builtin.shell:
        cmd: |
          python3 - <<'PYEOF'
          import csv
          import fcntl
          import os

          path = os.environ["REPORT_FILE"]
          sep = "\x1f"

          def safe_cell(val: str) -> str:
              s = str(val if val is not None else "").replace("\r", " ").replace("\n", " ")
              if s.startswith(("=", "+", "-", "@", "\t")):
                  s = "'" + s
              return s

          def is_nginx_patched(ver: str) -> bool:
              try:
                  parts = tuple(int(x) for x in ver.split(".")[:3])
                  if len(parts) < 3:
                      return False
                  if parts[0] == 1 and parts[1] == 30 and parts[2] >= 7:
                      return True
                  if parts[0] == 1 and parts[1] == 31 and parts[2] >= 9:
                      return True
                  if parts >= (1, 32, 0):
                      return True
                  return False
              except ValueError:
                  return False

          def calc_risk(has_ngx, ver, h2, h3, mail, dyn, mir, ssi, sctp_l):
              if has_ngx == "NO":
                  return "MEDIUM_SCTP_LOADED_NO_NGINX" if sctp_l.startswith("YES") else "LOW_NO_NGINX"
              if has_ngx == "NO_SHELL_OR_BIN":
                  return "REVIEW_DISTROLESS_CONTAINER"
              if is_nginx_patched(ver):
                  return "LOW_NGINX_PATCHED_CHECK_SCTP" if sctp_l.startswith("YES") else "OK_PATCHED"
              if h2 == "YES" or h3 == "YES" or mail == "YES" or (dyn == "YES" and (mir == "YES" or ssi == "YES")):
                  return "CRITICAL_ACTIVE_VECTOR_AND_SCTP" if sctp_l.startswith("YES") else "CRITICAL_ACTIVE_VECTOR"
              if h2 == "ERR":
                  return "REVIEW_NGINX_CFG_ERROR"
              return "MEDIUM_VULN_VER_NO_ACTIVE_VECTOR"

          raw_lines = [line for line in os.environ.get("RAW_LINES", "").splitlines() if line.strip()]
          rows = []
          for line in raw_lines:
              parts = line.split(sep)
              if len(parts) < 14:
                  continue
              target, img, has_ngx, ver, mods, h2, h3, mail, dyn, mir, ssi, res, sctp_l, sctp_m = parts[:14]
              risk = calc_risk(has_ngx, ver, h2, h3, mail, dyn, mir, ssi, sctp_l)
              rows.append([
                  safe_cell(os.environ["H_NAME"]),
                  safe_cell(os.environ["H_IP"]),
                  safe_cell(os.environ["H_OS"]),
                  safe_cell(os.environ["H_KERNEL"]),
                  safe_cell(target),
                  safe_cell(img),
                  safe_cell(has_ngx),
                  safe_cell(ver),
                  safe_cell(mods),
                  safe_cell(h2),
                  safe_cell(h3),
                  safe_cell(mail),
                  safe_cell(dyn),
                  safe_cell(mir),
                  safe_cell(ssi),
                  safe_cell(res),
                  safe_cell(sctp_l),
                  safe_cell(sctp_m),
                  safe_cell(risk),
              ])

          os.umask(0o027)
          with open(path, "a+", newline="", encoding="utf-8") as f:
              fcntl.flock(f.fileno(), fcntl.LOCK_EX)
              f.seek(0, os.SEEK_END)
              is_empty = f.tell() == 0
              if is_empty:
                  f.write("\ufeff")
              writer = csv.writer(f, delimiter=";", quoting=csv.QUOTE_MINIMAL)
              if is_empty:
                  writer.writerow([
                      "host",
                      "ip",
                      "os_distribution",
                      "kernel",
                      "target",
                      "image_or_bin",
                      "nginx_found",
                      "nginx_version",
                      "nginx_modules",
                      "http2_active",
                      "http3_quic_active",
                      "mail_block_active",
                      "dyn_proxy_pass",
                      "mirror_active",
                      "ssi_on_active",
                      "resolver_active",
                      "sctp_loaded",
                      "sctp_modprobe_rules",
                      "risk_status",
                  ])
              for r in rows:
                  writer.writerow(r)
              f.flush()
              os.fsync(f.fileno())
              fcntl.flock(f.fileno(), fcntl.LOCK_UN)
          PYEOF
      environment:
        REPORT_FILE: "{{ report_file }}"
        H_NAME: "{{ inventory_hostname }}"
        H_IP: "{{ ansible_default_ipv4.address | default('N/A') }}"
        H_OS: "{{ ansible_distribution | default('N/A') }} {{ ansible_distribution_version | default('') }}"
        H_KERNEL: "{{ ansible_kernel | default('N/A') }}"
        RAW_LINES: "{{ audit_rows.stdout | default('') }}"
      delegate_to: "{{ report_host }}"
      throttle: 1
      changed_when: false
      check_mode: false

    - name: Вывести путь к сформированному отчёту в лог запуска
      ansible.builtin.debug:
        msg: "Аудит завершён. Отчёт сохранён на {{ report_host }}: {{ report_file }}"
      run_once: true
      check_mode: false